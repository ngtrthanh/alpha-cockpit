name: Deploy OCI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA on main to deploy (blank = current main)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: alpha-cockpit-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, ARM64, alpha-cockpit]
    environment: production
    steps:
      - name: Resolve target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          elif [[ -n "$MANUAL_SHA" ]]; then
            echo "sha=$MANUAL_SHA" >> "$GITHUB_OUTPUT"
          else
            sha="$(git ls-remote https://github.com/ngtrthanh/alpha-cockpit.git refs/heads/main | awk '{print $1}')"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy exact CI artifact
        shell: bash
        env:
          DEPLOY_DIR: ${{ vars.ALPHA_DEPLOY_DIR }}
        run: |
          chmod +x scripts/deploy.sh
          scripts/deploy.sh "${{ steps.target.outputs.sha }}"

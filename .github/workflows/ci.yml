name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      HERMES_API_KEY: ci-hermes-key-123456
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy script syntax
        run: bash -n scripts/deploy.sh

      - name: Validate compose
        run: docker compose config >/dev/null

      - name: Build test image
        run: docker build -t alpha-cockpit:test .

      - name: Run unit tests in image
        run: docker run --rm alpha-cockpit:test python -m unittest discover -s tests -v

      - name: Smoke test app container
        run: |
          docker run -d --name alpha-cockpit-test -p 16868:6868             -e APP_COMMIT_SHA="$GITHUB_SHA" alpha-cockpit:test
          trap 'docker logs alpha-cockpit-test || true; docker rm -f alpha-cockpit-test || true' EXIT
          for i in $(seq 1 30); do
            if health="$(curl -fsS http://127.0.0.1:16868/api/health)"; then
              echo "$health" | grep -Fq "\"commit\": \"$GITHUB_SHA\""
              curl -fsS http://127.0.0.1:16868/api/runtime
              curl -fsS http://127.0.0.1:16868/api/paper
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested commit image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ngtrthanh/alpha-cockpit:sha-${{ github.sha }}
            ghcr.io/ngtrthanh/alpha-cockpit:latest

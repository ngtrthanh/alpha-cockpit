services:
  hermes:
    image: nousresearch/hermes-agent:stable
    command: gateway run
    restart: unless-stopped
    expose:
      - "8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY:?set HERMES_API_KEY in .env}"
    volumes:
      - ./hermes-data:/opt/data
      - ./hermes/skills/alpha-cockpit:/opt/data/skills/alpha-cockpit:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  alpha-cockpit:
    build: .
    ports:
      - "6868:6868"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "6868"
      INVEST_DB: "/app/data/investment.db"
      HERMES_URL: "http://hermes:8642"
      ALLOW_DEMO_DATA: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      INVEST_DB: "/app/data/investment.db"
      HERMES_URL: "http://hermes:8642"
      ALLOW_DEMO_DATA: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped

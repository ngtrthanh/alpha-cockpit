services:
  hermes:
    image: nousresearch/hermes-agent:stable
    command: gateway run
    restart: unless-stopped
    expose:
      - "8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY:?set HERMES_API_KEY}"
    volumes:
      - ./hermes-data:/opt/data
      - ./hermes/skills/alpha-cockpit:/opt/data/skills/alpha-cockpit:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  alpha-cockpit:
    build: .
    ports:
      - "6868:6868"
    environment:
      HOST: "0.0.0.0"
      PORT: "6868"
      INVEST_DB: "/app/data/investment.db"
      HERMES_URL: "http://hermes:8642"
      HERMES_API_KEY: "${HERMES_API_KEY:?set HERMES_API_KEY}"
      CODEX_PROVIDER: "${CODEX_PROVIDER:-openai-codex}"
      CODEX_MODEL: "${CODEX_MODEL:-}"
      CLAUDE_PROVIDER: "${CLAUDE_PROVIDER:-anthropic}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-}"
    volumes:
      - ./data:/app/data
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      INVEST_DB: "/app/data/investment.db"
      HERMES_URL: "http://hermes:8642"
      HERMES_API_KEY: "${HERMES_API_KEY:?set HERMES_API_KEY}"
      CODEX_PROVIDER: "${CODEX_PROVIDER:-openai-codex}"
      CODEX_MODEL: "${CODEX_MODEL:-}"
      CLAUDE_PROVIDER: "${CLAUDE_PROVIDER:-anthropic}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-}"
      SSI_CLIENT_ID: "${SSI_CLIENT_ID:-}"
      SSI_API_KEY: "${SSI_API_KEY:-}"
      SSI_API_SECRET: "${SSI_API_SECRET:-}"
      PAPER_ENABLED: "${PAPER_ENABLED:-true}"
      AGENT_INTERVAL_SECONDS: "${AGENT_INTERVAL_SECONDS:-21600}"
      PAPER_INTERVAL_SECONDS: "${PAPER_INTERVAL_SECONDS:-5}"
    volumes:
      - ./data:/app/data
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped
